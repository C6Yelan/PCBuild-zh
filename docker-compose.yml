services:
  pcbuild-db:
    image: postgres:16
    container_name: pcbuild-postgres
    environment:
      POSTGRES_USER: pcbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pcbuild
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: pcbuild-zh-backend
    container_name: pcbuild-migrate
    depends_on:
      pcbuild-db:
        condition: service_healthy
    environment:
      # 由 compose interpolation 注入，不把密碼寫進 yml
      DATABASE_URL: postgresql+psycopg2://pcbuild:${POSTGRES_PASSWORD}@pcbuild-db:5432/pcbuild
    working_dir: /app
    command: ["python", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"

  fastapi:
    build:
      context: .
      args:
        # 必填：由 release/run 注入版本（例如 git sha）
        APP_GIT_SHA: ${APP_GIT_SHA:?APP_GIT_SHA is required in release/run environment}
    image: pcbuild-zh-backend
    container_name: pcbuild-fastapi
    volumes:
      - ./_crawler_raw:/app/_crawler_raw:ro
      - ./temp:/app/temp
    depends_on:
      pcbuild-db:
        condition: service_healthy
      pcbuild-redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_MODULE: backend.app:create_app
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      RESEND_REGION: ${RESEND_REGION}
      DATABASE_URL: postgresql+psycopg2://pcbuild:${POSTGRES_PASSWORD}@pcbuild-db:5432/pcbuild
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@pcbuild-redis:6379/0
      RATE_LIMIT_DEFAULT: 300/minute
      CSRF_TRUSTED_ORIGINS: https://pcbuild.redfiretw.xyz
      REQUEST_LOG_MODE: all
      # 必填：讓 t7/t9 pipeline log 的 app_git_sha 可追蹤部署版本
      APP_GIT_SHA: ${APP_GIT_SHA:?APP_GIT_SHA is required in release/run environment}
      # docker compose exec 跑 t7/t9 CLI 時，將 pipeline log 同步寫到 PID1 stdout，讓 Loki 可收集
      PCBUILD_LOG_TO_PID1: "1"
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-lc", "uvicorn --factory $$APP_MODULE --host 0.0.0.0 --port 8000 --no-server-header --no-date-header --no-proxy-headers --no-access-log"]
    restart: unless-stopped

  pcbuild-scheduler:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:?APP_GIT_SHA is required in release/run environment}
    image: pcbuild-zh-backend
    container_name: pcbuild-scheduler
    volumes:
      - ./temp:/app/temp
    depends_on:
      pcbuild-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://pcbuild:${POSTGRES_PASSWORD}@pcbuild-db:5432/pcbuild
      APP_GIT_SHA: ${APP_GIT_SHA:?APP_GIT_SHA is required in release/run environment}
      PCBUILD_LOG_TO_PID1: "1"
    command: ["python", "-m", "backend.tools.ops.t10_scheduler_loop", "--source", "coolpc", "--publish"]
    restart: unless-stopped

  pcbuild-retention:
    image: pcbuild-zh-backend
    container_name: pcbuild-retention
    depends_on:
      pcbuild-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://pcbuild:${POSTGRES_PASSWORD}@pcbuild-db:5432/pcbuild
      APP_GIT_SHA: ${APP_GIT_SHA:?APP_GIT_SHA is required in release/run environment}
      PCBUILD_LOG_TO_PID1: "1"
    command:
      ["sh","-lc",
       "while true; do python -m backend.tools.ops.t9_db_retention --confirm --batch-size 5000 --max-batches 20; sleep 86400; done"]
    restart: unless-stopped
    
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pcbuild-cloudflared
    command: ["tunnel", "--no-autoupdate", "--config", "/home/nonroot/cloudflared/config.yml", "run"]
    volumes:
        - ./cloudflared:/home/nonroot/cloudflared:ro
    depends_on:
      fastapi:
        condition: service_started
    restart: unless-stopped
    
  pcbuild-redis:
    image: redis:7-alpine
    container_name: pcbuild-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      
  loki:
    image: grafana/loki:3.5
    container_name: pcbuild-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./data/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pcbuild-grafana
    environment:
      # 請放在 .env：GRAFANA_ADMIN_PASSWORD=一組強密碼
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      
      # 新增：Resend SMTP（587 + STARTTLS）
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.resend.com:587"
      GF_SMTP_USER: "resend"
      GF_SMTP_PASSWORD: ${RESEND_SMTP_API_KEY}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: "PCBuild Alerts"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: pcbuild-alloy
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    restart: unless-stopped
