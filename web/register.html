<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>註冊 · PCBuild-zh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./assets/css/common/auth-shared.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-layout.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-field.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-form.css" />
    <link rel="stylesheet" href="./assets/css/pages/register.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="logo">PCBuild-zh</div>
        <p class="subtitle">建立帳號以保存配單與後續功能</p>

        <form id="register-form" novalidate>
          <label class="field" data-field="email">
            <div class="field-label-row">
              <span class="field-label-main">Email</span>
              <span class="field-error-text"></span>
            </div>
              <input
                id="email"
                type="email"
                autocomplete="email"
                required
                maxlength="50"
                placeholder="name@example.com"
              />
          </label>

          <label class="field" data-field="username">
            <div class="field-label-row">
              <span class="field-label-main">使用者名稱</span>
              <span class="field-error-text"></span>
            </div>
            <input
              id="username"
              type="text"
              autocomplete="username"
              required
              minlength="3"
              maxlength="50"
              placeholder="例如：user_123"
            />
          </label>

          <label class="field" data-field="password">
            <div class="field-label-row">
              <span class="field-label-main">密碼</span>
              <span class="field-error-text"></span>
            </div>
            <div class="pw-wrap">
              <input
                id="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="128"
                placeholder="至少 8 個字元"
              />
              <button
                type="button"
                class="pw-toggle"
                aria-label="切換密碼顯示"
                aria-pressed="false"
                aria-controls="password"
                data-pw-target="password"
                title="顯示/隱藏密碼"
              >
                <svg class="pw-icon pw-icon-eye" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="pw-icon pw-icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false" hidden>
                  <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M2 12s3.5-7 10-7c2 0 3.8.6 5.4 1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M22 12s-3.5 7-10 7c-2 0-3.8-.6-5.4-1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="field" data-field="password-confirm">
            <div class="field-label-row">
              <span class="field-label-main">確認密碼</span>
              <span class="field-error-text"></span>
            </div>
            <div class="pw-wrap">
              <input
                id="password-confirm"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="128"
                placeholder="請再次輸入密碼"
              />
              <button
                type="button"
                class="pw-toggle"
                aria-label="切換確認密碼顯示"
                aria-pressed="false"
                aria-controls="password-confirm"
                data-pw-target="password-confirm"
                title="顯示/隱藏確認密碼"
              >
                <svg class="pw-icon pw-icon-eye" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="pw-icon pw-icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false" hidden>
                  <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M2 12s3.5-7 10-7c2 0 3.8.6 5.4 1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M22 12s-3.5 7-10 7c-2 0-3.8-.6-5.4-1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
            </div>
          </label>

          <div class="actions-row">
            <button type="submit" id="register-btn" class="btn-primary">
              註冊
            </button>
          </div>

          <p class="hint">
            已經有帳號了？<a href="/login.html">前往登入</a>
          </p>

          <p id="error" class="error" aria-live="polite"></p>
        </form>
      </div>

      <div class="back-home">
        <a href="/">回到首頁</a>
      </div>
    </div>
    <script src="./assets/js/pages/register.js"></script>
  </body>
</html>
