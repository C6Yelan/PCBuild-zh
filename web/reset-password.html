<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>重設密碼 · PCBuild-zh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Favicons -->
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">

    <!-- 避免 URL token 透過 referrer 外洩 -->
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="./assets/css/common/auth-shared.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-layout.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-field.css" />
    <link rel="stylesheet" href="./assets/css/common/auth-form.css" />
    <link rel="stylesheet" href="./assets/css/pages/reset-password.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="logo">PCBuild-zh</div>
        <p class="subtitle">
          請設定新的登入密碼。
        </p>

        <form id="reset-form" novalidate>
          <label class="field" data-field="password">
            <div class="field-label-row">
              <span class="field-label-main">新密碼</span>
              <span class="field-error-text"></span>
            </div>
            <div class="pw-wrap">
              <input
                id="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="128"
                placeholder="至少 8 個字元"
              />
              <button
                type="button"
                class="pw-toggle"
                aria-label="切換新密碼顯示"
                aria-pressed="false"
                aria-controls="password"
                data-pw-target="password"
                title="顯示/隱藏新密碼"
              >
                <svg class="pw-icon pw-icon-eye" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="pw-icon pw-icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false" hidden>
                  <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M2 12s3.5-7 10-7c2 0 3.8.6 5.4 1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M22 12s-3.5 7-10 7c-2 0-3.8-.6-5.4-1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="field" data-field="password-confirm">
            <div class="field-label-row">
              <span class="field-label-main">再次輸入新密碼</span>
              <span class="field-error-text"></span>
            </div>
            <div class="pw-wrap">
            <input
              id="password-confirm"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="128"
              placeholder="請再次輸入密碼"
            />
            <button
              type="button"
              class="pw-toggle"
              aria-label="切換再次輸入新密碼顯示"
              aria-pressed="false"
              aria-controls="password-confirm"
              data-pw-target="password-confirm"
              title="顯示/隱藏再次輸入新密碼"
            >
              <svg class="pw-icon pw-icon-eye" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="pw-icon pw-icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false" hidden>
                <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M2 12s3.5-7 10-7c2 0 3.8.6 5.4 1.6" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M22 12s-3.5 7-10 7c-2 0-3.8-.6-5.4-1.6" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
          </label>

          <div class="actions-row">
            <button type="submit" id="reset-btn" class="btn-primary">
              重設密碼
            </button>
          </div>

          <p class="hint">
            重設成功後將導回 <a href="/login.html">登入頁</a>。
          </p>

          <p id="error" class="error" aria-live="polite"></p>
        </form>
      </div>

      <div class="back-home">
        <a href="/">回到首頁</a>
      </div>
    </div>
    <script src="./assets/js/pages/reset-password.js"></script>
  </body>
</html>
